 var(--line);border-radius:12px;padding:14px 18px;font-size:19px;color:var(--ink)}.action{background:white;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:18px;font-weight:700}.action:hover{background:#e9efe5}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#1c523d}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 18px}h2{font-size:27px;margin:0}.count{font-size:16px;color:#617265}.help{font-size:17px;color:#617265;line-height:1.7;margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}.card{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 10px #203d3605;padding:24px;min-height:170px;transition:border-color .15s,box-shadow .15s}.card:hover{border-color:#5d9677;box-shadow:0 6px 15px #203d3612}.card.open{border-color:#61917b;background:#fcfef9}.card-meta{display:flex;justify-content:space-between;align-items:center;color:#668071;font-size:14px;margin-bottom:18px}.term{font-size:var(--word);font-family:"DFKai-SB","標楷體","BiauKai","Microsoft JhengHei",serif;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.definition{font-size:var(--meaning);line-height:1.8;overflow-wrap:anywhere;font-weight:500}.reveal{display:block;border-top:1px dashed var(--line);margin-top:20px;padding-top:18px}.answer-label{display:block;color:var(--green);font-size:15px;margin-bottom:6px}.hidden{display:none!important}.empty{text-align:center;font-size:22px;grid-column:1/-1;padding:60px 0}.quiz{background:white;border:1px solid var(--line);border-radius:20px;padding:30px;max-width:1100px;margin:24px auto}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:18px}.quiz-top select{padding:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;max-width:100%}.score{font-weight:700;color:var(--green)}.prompt-label{font-size:16px;color:#617265;margin:30px 0 12px}.prompt{font-size:var(--meaning);line-height:1.9;white-space:pre-wrap}.prompt.word{font-size:var(--word);font-family:"DFKai-SB","標楷體",serif}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0}.option{background:var(--paper);border:2px solid transparent;border-radius:14px;padding:20px;text-align:left;font-size:var(--meaning);line-height:1.6;overflow-wrap:anywhere}.option:hover:not(:disabled){border-color:#7b9f86}.option.right{border-color:#2f8050;background:#edf8ed}.option.wrong{border-color:#bb6557;background:#fff0ed}.feedback{font-size:23px;font-weight:700;min-height:40px;line-height:1.7}.feedback small{font-size:19px;font-weight:400;display:block}.quiz-bottom{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}footer{font-size:15px;line-height:1.8;color:#718074;padding-top:35px;padding-bottom:40px;border-top:1px solid var(--line);margin-top:35px}button{touch-action:manipulation}

<body>
<header><div class="top"><div><div class="eyebrow">六年級國語 · 第一課至第六課</div><h1>詞語小學堂</h1></div><div class="badge">112 個詞語與成語</div></div><p>點一個詞語，認識它的意思。換個方向，也能練習把詞語想起來。</p><nav class="lessons" id="lessons" aria-label="選擇課次"></nav></header>

<script id="vocabularyData" type="application/json">[{"id": 1, "title": "跑道", "items": [{"term": "壓軸", "meaning": "戲劇的最後一齣稱大軸，大軸前一齣稱壓軸。比喻最精彩、最引人注目的節目或事件。"}, {"term": "爭奪", "meaning": "爭相奪取，互不退讓。"}, {"term": "委屈", "meaning": "⑴因遭受不合理的待遇而感到難過。⑵壓制自己的意志，以遷就他人或環境。⑶虧待，有不足於人之意。"}, {"term": "偏心", "meaning": "偏袒一方，對某一方存私心。"}, {"term": "搬運", "meaning": "把東西搬動、運送到別處。"}, {"term": "芥蒂", "meaning": "微小的梗塞物。比喻心裡不舒服或與人有嫌隙。"}, {"term": "壓抑", "meaning": "對人的思想、情感、行為等加以抑止或限制。"}, {"term": "拒絕", "meaning": "不接受、不答應。"}, {"term": "尷尬", "meaning": "⑴處境困窘或事情棘手，難以應付。⑵不好意思、難為情。"}, {"term": "後悔", "meaning": "事後懊悔當初的不該。"}, {"term": "拱手讓人", "meaning": "輕易的把東西讓給別人。"}, {"term": "距離", "meaning": "⑴時間或空間、有形或無形的間隔。⑵相隔、相距。"}, {"term": "默默", "meaning": "沉靜不說話。"}, {"term": "鬥志", "meaning": "奮發進取的意志。"}, {"term": "扭曲", "meaning": "⑴扭動物體使其形態改變。⑵歪曲、顛倒。"}, {"term": "猛然", "meaning": "突然。"}, {"term": "巧奪天工", "meaning": "雖是人工製造，但是精巧勝過天然。形容技藝的巧妙神奇。"}, {"term": "屈指可數", "meaning": "彎曲手指可計數，形容數量很少。"}, {"term": "以偏概全", "meaning": "以少數的例證或特殊的情形，強行概括整體。"}, {"term": "瓜熟蒂落", "meaning": "瓜熟了，瓜蒂自然脫落。比喻懷胎足月生產，亦用於比喻時機成熟，事情自然成功。"}, {"term": "潛移默化", "meaning": "人的思想、性格或習慣，因受到外界的影響而在不知不覺中起了變化。"}, {"term": "勾心鬥角", "meaning": "比喻彼此明爭暗鬥，各用心機。"}]}, {"id": 2, "title": "朱子治家格言選", "items": [{"term": "綢繆", "meaning": "纏繞束縛，本課指修補器物，讓它更加堅固。"}, {"term": "掘井", "meaning": "挖井。"}, {"term": "纏繞", "meaning": "圍繞束縛。"}, {"term": "束縛", "meaning": "拘束或限制。"}, {"term": "瓦缶", "meaning": "一種有蓋、腹大口小，用來盛裝酒或水的陶器。"}, {"term": "珍饈", "meaning": "珍奇美味的食物。"}, {"term": "陶器", "meaning": "用陶土燒製的器物。坯質不透明，具吸水性，焙燒溫度較瓷器低，質地較瓷器粗糙，可塗上不同的顏色或彩色花紋。"}, {"term": "施惠", "meaning": "給予恩惠、德澤。"}, {"term": "預留", "meaning": "事先保留。"}, {"term": "樂極生悲", "meaning": "歡樂至極，往往會轉生悲愁。"}, {"term": "腰纏萬貫", "meaning": "指身上有大筆的錢財。比喻財富極多。"}, {"term": "作繭自縛", "meaning": "蠶吐絲結繭，將自己包裹於內。後用以比喻人做某事，反而使自己陷入困境。"}, {"term": "冰消瓦解", "meaning": "像冰一樣融化了，像瓦一樣破碎了。比喻事物潰敗分裂，亦用於比喻問題完全解決。"}, {"term": "口蜜腹劍", "meaning": "口中有蜜，肚子裡卻藏著劍。比喻一個人嘴上說得好聽，事實上卻內心險惡，處處想陷害別人。"}, {"term": "因材施教", "meaning": "依據受教者不同的資材，而給予不同的教導。"}, {"term": "悲天憫人", "meaning": "憂傷時局多變，哀憐百姓疾苦。"}]}, {"id": 3, "title": "談遇見更好的自己", "items": [{"term": "中流砥柱", "meaning": "如砥柱般屹立在湍急的水流中。比喻獨立不撓、能擔當重任支撐大局的人。"}, {"term": "茁壯", "meaning": "成長壯大。"}, {"term": "砥礪", "meaning": "⑴砥、礪都是磨刀石，引申為磨練。⑵勉勵。"}, {"term": "隔靴搔癢", "meaning": "隔著靴子搔癢。比喻做事、說話等未能掌握重點、關鍵。"}, {"term": "方仲永", "meaning": "北宋時期江西金溪人，是北宋文學家王安石的散文〈傷仲永〉中的主角。五歲時能作詩，被稱為神童，天資聰穎。然而他最後因未求上進，導致才華荒廢。"}, {"term": "瑣事", "meaning": "細小零碎的事情。"}, {"term": "欠缺", "meaning": "短少、不夠。"}, {"term": "別出心裁", "meaning": "獨出巧思，與眾不同。"}, {"term": "耕耘", "meaning": "⑴比喻付出精神和勞力。⑵耕田與除草。泛指農田耕作的事情。"}, {"term": "伯仲之間", "meaning": "比喻程度相當，不相上下。"}, {"term": "總裁", "meaning": "某些政黨首領的名稱。銀行或財團亦設此職位。"}, {"term": "卓越", "meaning": "非常優秀，超出常人。"}, {"term": "無異", "meaning": "相同、沒有差別。"}, {"term": "異口同聲", "meaning": "不同人的嘴裡說出同樣的話。形容眾人的說法或看法相同。"}, {"term": "耕田", "meaning": "泛指耕種田地的一切活動。"}, {"term": "惋惜", "meaning": "嘆惜、令人感覺可惜。"}, {"term": "驕傲自滿", "meaning": "自以為了不起而傲慢自大，感覺已經滿足。"}, {"term": "賺錢", "meaning": "⑴賺取財利。⑵利潤較高的。"}, {"term": "恃才傲物", "meaning": "依仗本身有才幹而驕傲，目空一切。"}, {"term": "培養", "meaning": "⑴長期策畫和訓練。⑵在適宜的環境中培植養育。"}]}, {"id": 4, "title": "臺灣美食詩選", "items": [{"term": "彰化", "meaning": "縣名。位於臺灣西部中段之大肚溪南、濁水溪北，面積一千餘平方公里，境內土地肥沃，盛產花果。"}, {"term": "油炸", "meaning": "利用煮沸的油使食物熟透。"}, {"term": "颳風", "meaning": "起風、吹風。"}, {"term": "竹筍", "meaning": "竹子地下莖所生的嫩芽。可供食用，亦可入藥，有消渴、利尿的療效。"}, {"term": "廚師", "meaning": "掌理廚房烹飪事務的師傅。"}, {"term": "豬肉", "meaning": "從豬身上取得的肉。"}, {"term": "攪拌", "meaning": "攪動、拌合。"}, {"term": "目不識丁", "meaning": "連一「丁」字都不認識。比喻不識字或毫無學問。"}, {"term": "欲蓋彌彰", "meaning": "形容想要掩飾過失，反而使過失更加明顯。"}, {"term": "饗宴", "meaning": "招待賓客的宴席。"}, {"term": "雨後春筍", "meaning": "春筍在雨後長得又多又快。比喻事物在某一時期新生之後大量湧現，迅速發展。"}, {"term": "晒乾", "meaning": "將潮溼物品置於日光下曝晒，使水分蒸發至乾燥。"}, {"term": "鼎邊趖", "meaning": "一種小吃。把米漿沿著熱鍋鍋緣一圈淋下，讓米漿順勢下滑。蓋上鍋蓋，蒸、煎成粿片後取出放涼，切成條狀，再加入蔥、薑、魷魚、香菇、金針、肉焿等佐料，煮熟即成。"}, {"term": "晶瑩", "meaning": "明亮透澈。"}, {"term": "淋漓盡致", "meaning": "形容文章或言語表達得暢達詳盡。"}, {"term": "相得益彰", "meaning": "指互相配合、映襯，更能顯出各自的優點。"}, {"term": "醃製", "meaning": "以醃漬方法所製成。"}, {"term": "一言九鼎", "meaning": "九鼎，傳說中夏禹的傳國寶器。形容說話很有分量。"}]}, {"id": 5, "title": "最好的味覺禮物", "items": [{"term": "粉身碎骨", "meaning": "把身體、骨頭都粉碎掉，比喻犧牲生命。在本課是特殊用法，指將芭樂充分打碎，故加上引號。"}, {"term": "焦糖", "meaning": "蔗糖加熱至攝氏二百度所製成的棕色物質。應用於醬油、糖果、醋、啤酒等的著色。"}, {"term": "熬煮", "meaning": "用小火慢慢烹煮。"}, {"term": "粗茶淡飯", "meaning": "簡單清淡的飲食。"}, {"term": "飛黃騰達", "meaning": "比喻在仕途或事業上快速得志發跡。"}, {"term": "流淌", "meaning": "流動。在本課是指流下、流出。"}, {"term": "相濡以沫", "meaning": "泉水乾涸，魚兒以口沫互相潤溼。後用來比喻同處困境中，互相以微力救助。"}, {"term": "下午茶", "meaning": "本指下午四點至五點時，所吃的茶點。為流行於西洋社會的正規活動。後比喻午後的社交活動或休息時間。"}, {"term": "按部就班", "meaning": "寫作文章時，依照文義、安排部次，考究詞語，組織章句。後用來比喻做事依照一定的層次、步驟進行。"}, {"term": "豐沛", "meaning": "充足、充沛。"}, {"term": "熱騰騰", "meaning": "形容很熱或冒著熱氣的樣子。"}, {"term": "退避三舍", "meaning": "指為避免正面衝突或因害怕而主動讓步逃避，不與對方相抗。本課是指躲得遠遠的。"}, {"term": "砂糖", "meaning": "由蔗糖製成的顆粒狀糖。"}, {"term": "顛沛流離", "meaning": "形容生活困迫不安，四處流浪。"}, {"term": "混合", "meaning": "摻雜調和。"}, {"term": "魚目混珠", "meaning": "以魚的眼珠混充珍珠。比喻以假亂真。"}, {"term": "啜飲", "meaning": "喝、吸食。"}, {"term": "泡沫", "meaning": "聚在一堆的許多小氣泡。"}]}, {"id": 6, "title": "珍珠奶茶", "items": [{"term": "聯袂", "meaning": "衣袖相連。比喻攜手、一同。"}, {"term": "擴展", "meaning": "擴充發展。"}, {"term": "粉末", "meaning": "細末狀的固體顆粒。"}, {"term": "平衡", "meaning": "對立的雙方面在數量、質量或力道上相等或相互抵消。"}, {"term": "水乳交融", "meaning": "水與乳融合在一起。比喻彼此關係密切，契合無間。"}, {"term": "徜徉", "meaning": "安閒自在的四處走動。"}, {"term": "畫蛇添足", "meaning": "畫好蛇後，多事為它添上蛇足，結果反而失去本已贏得的酒。比喻多此一舉，反將事情弄糟。"}, {"term": "增添", "meaning": "加添。"}, {"term": "披薩", "meaning": "一種義大利食品。在盤底鋪一層發酵過的麵餅，上面放入乾酪以及所需的餡料，如肉品、海鮮、蔬菜、水果等，快速焙烤而成。"}, {"term": "煉乳", "meaning": "濃縮精製後的牛奶或羊奶。將鮮牛奶或羊奶消毒後，加入百分之十五至十六的蔗糖，於真空蒸發器中濃縮，減少其水分後裝罐，是可長期保存的乳品。通常供飲用或複製食品用。"}, {"term": "捨本逐末", "meaning": "指人民不務農業而從事工、商。後用來指人不求事物的根本大端，只重視微末小節。"}, {"term": "黏稠", "meaning": "濃稠有黏性的。"}, {"term": "樹薯", "meaning": "植物名。落葉灌木。原產巴西，分布於西、南非洲及亞洲南部各國。莖有髓，脆而易折，分枝為三叉。葉掌狀，花為圓錐花序，黃或紅黃色。果實為球狀蒴果，其肉質地下塊根亦以此為名。"}, {"term": "烹茶", "meaning": "沏茶、泡茶。"}, {"term": "兔死狗烹", "meaning": "兔子死盡了，用來捕兔的獵狗因為失去了作用而被烹食。比喻事成之後，有功之人即遭到殺戮或見棄的命運。"}, {"term": "如虎添翼", "meaning": "猛虎生出雙翅。比喻強有力者又增添生力軍，使之更強。"}, {"term": "為人作嫁", "meaning": "為別人做出嫁時穿的衣裳。後用來比喻徒然為他人辛苦，自己卻得不到好處。"}, {"term": "風靡", "meaning": "比喻流行、轟動。"}]}]</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('vocabularyData').textContent);
const $=id=>document.getElementById(id);
let lesson=DATA[0],mode='words',order=[...lesson.items],opened=new Set();
let deck=[],position=0,correct=0,answered=0,locked=false,current=null;
const unlockedGroups=new Set();
const groupPasswords=['591','520','789'];
function lessonGroup(){return Math.floor((lesson.id-1)/2);}
function hasAccess(){return unlockedGroups.has(lessonGroup());}
function syncAccess(){const allowed=hasAccess();$('accessGate').classList.toggle('hidden',allowed);$('activity').classList.toggle('hidden',!allowed);$('accessPassword').value='';$('accessPassword').removeAttribute('aria-invalid');$('accessError').textContent='';const first=lessonGroup()*2+1;$('gateLesson').textContent=`第 ${first} 課與第 ${first+1} 課的練習需要活動密碼。`;if(!allowed){$('cards').replaceChildren();$('options').replaceChildren();$('prompt').textContent='';$('feedback').replaceChildren();}return allowed;}
$('accessForm').onsubmit=e=>{e.preventDefault();if($('accessPassword').value.trim()!==groupPasswords[lessonGroup()]){$('accessError').textContent='密碼不正確，請再試一次。';$('accessPassword').setAttribute('aria-invalid','true');$('accessPassword').value='';$('accessPassword').focus();return;}unlockedGroups.add(lessonGroup());syncAccess();if(mode==='quiz')startQuiz();else renderCards();$('relock').focus({preventScroll:true});};
$('relock').onclick=()=>{unlockedGroups.clear();opened.clear();syncAccess();$('accessPassword').focus();};
function shuffled(items){const result=[...items];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
function clue(item){return item.meaning.split(item.term).join('＿＿');}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function renderNav(){ $('lessons').replaceChildren(...DATA.map(l=>{const b=el('button','lesson');b.append(el('strong','',`第 ${l.id} 課`),el('span','',l.title));b.setAttribute('aria-pressed',String(l.id===lesson.id));b.onclick=()=>chooseLesson(l);return b;}));}
function chooseLesson(l){lesson=l;order=[...l.items];opened.clear();$('search').value='';renderNav();updateTitle();if(!syncAccess())return;if(mode==='quiz')startQuiz();else renderCards();}
function updateTitle(){ $('lessonTitle').textContent=`第 ${lesson.id} 課　${lesson.title}`;$('count').textContent=`本課 ${lesson.items.length} 個詞語與成語`;}
function renderCards(){if(!hasAccess())return;const query=$('search').value.trim();const list=order.filter(x=>x.term.includes(query)||x.meaning.includes(query));$('help').textContent=mode==='words'?'先讀詞語，想想它的意思，再點卡片看解釋。再點一次就能收起。':'先看解釋，想想是哪一個詞語，再點卡片揭曉答案。也可以輸入解釋中的關鍵字來查找。';if(query)$('count').textContent=`找到 ${list.length} 個／本課 ${lesson.items.length} 個`;else updateTitle();$('cards').replaceChildren();if(!list.length){$('cards').append(el('p','empty','沒有找到符合的詞語，試試其他關鍵字。'));return;}
list.forEach((item,index)=>{const isOpen=opened.has(item.term);const card=el('button','card'+(isOpen?' open':''));card.type='button';card.setAttribute('aria-expanded',String(isOpen));const meta=el('span','card-meta');meta.append(el('span','',String(index+1).padStart(2,'0')),el('span','',isOpen?'點一下收起':mode==='words'?'點一下看解釋':'點一下看詞語'));card.append(meta,el('span',mode==='words'?'term':'definition',mode==='words'?item.term:clue(item)));if(isOpen){const reveal=el('span','reveal');reveal.append(el('span','answer-label',mode==='words'?'詞語解釋':'答案'),el('span',mode==='words'?'definition':'term',mode==='words'?item.meaning:item.term));card.append(reveal);}card.onclick=()=>{if(opened.has(item.term))opened.delete(item.term);else opened.add(item.term);renderCards();const replacement=[...$('cards').children].find(x=>x.dataset.term===item.term);if(replacement)replacement.focus({preventScroll:true});};card.dataset.term=item.term;$('cards').append(card);});}
function setMode(value){mode=value;opened.clear();document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('browse').classList.toggle('hidden',mode==='quiz');$('quiz').classList.toggle('hidden',mode!=='quiz');updateTitle();if(!hasAccess())return;if(mode==='quiz')startQuiz();else renderCards();}
function startQuiz(){if(!hasAccess())return;deck=shuffled(lesson.items);position=0;correct=0;answered=0;showQuestion();}
function showQuestion(){locked=false;current=deck[position];$('next').disabled=true;$('next').textContent=position===deck.length-1?'看練習結果 →':'下一題 →';$('feedback').replaceChildren();$('score').textContent=`第 ${position+1}／${deck.length} 題 · 答對 ${correct} 題`;const reverse=$('quizDirection').value==='meaning';$('promptLabel').textContent=reverse?'這段解釋說的是哪一個詞語？':'哪一段是這個詞語的解釋？';$('prompt').textContent=reverse?clue(current):current.term;$('prompt').classList.toggle('word',!reverse);const choices=shuffled([current,...shuffled(lesson.items.filter(x=>x.term!==current.term)).slice(0,3)]);$('options').replaceChildren(...choices.map((item,index)=>{const b=el('button','option',`${String.fromCharCode(65+index)}　${reverse?item.term:item.meaning}`);b.dataset.correct=String(item.term===current.term);b.onclick=()=>answer(b,item);return b;}));}
function answer(button,item){if(locked)return;locked=true;answered++;const right=item.term===current.term;if(right)correct++;$('options').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('right');});if(!right)button.classList.add('wrong');$('feedback').append(el('span','',right?'✓ 答對了！':'再記一次：答案是「'+current.term+'」。'));$('feedback').append(el('small','',current.term+'：'+current.meaning));$('score').textContent=`已答 ${answered}／${deck.length} 題 · 答對 ${correct} 題`;$('next').disabled=false;}
$('next').onclick=()=>{if(!locked)return;if(position<deck.length-1){position++;showQuestion();}else{$('promptLabel').textContent='這一課練習完成';$('prompt').classList.remove('word');$('prompt').textContent=`完成 ${deck.length} 題，答對 ${correct} 題。`;$('options').replaceChildren();$('feedback').textContent=correct===deck.length?'全部答對！也試試另一個挑戰方向吧。':'可以再翻一翻詞語卡，然後重新挑戰。';$('next').disabled=true;$('score').textContent=`正確率 ${Math.round(correct/deck.length*100)}%`;}};
$('restart').onclick=startQuiz;$('quizDirection').onchange=startQuiz;$('search').oninput=renderCards;
$('shuffle').onclick=()=>{order=shuffled(order);opened.clear();renderCards();};$('collapse').onclick=()=>{opened.clear();renderCards();};
$('fontSize').oninput=e=>{const size=Number(e.target.value);document.documentElement.style.setProperty('--word',size+'px');document.documentElement.style.setProperty('--meaning',Math.round(size*.7)+'px');$('fontValue').textContent=size;};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));renderNav();updateTitle();syncAccess();
</script></body></html>
