            <h3 style="color:#FFD700; font-size: 28px; margin: 0 0 15px 0; text-align: center; text-shadow: 2px 2px 5px #000;">🏆 英雄排行榜 (Top 5) 🏆</h3>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- 網頁原生音效與配樂引擎 (Web Audio API 修復版) ---
        const SoundEngine = {
            ctx: null,
            bgmIsPlaying: false,
            bgmNextNoteTime: 0,
            bgmCurrentNote: 0,
            bgmTempo: 130, 
            bgmTimerID: null,
            // 修復點 1：將音符頻率提高一個八度，確保一般電腦/手機喇叭能清楚播出
            bgmSequence: [
                261.63, 261.63, 0, 261.63, 311.13, 0, 293.66, 261.63, 
                261.63, 261.63, 0, 261.63, 311.13, 0, 392.00, 311.13
            ],

            init: function() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                
                // 修復點 2：播放一段極短的「無聲音訊」，強制破解瀏覽器防範自動播放的限制
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                gain.gain.value = 0; // 靜音
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + 0.001);
            },
            
            startBGM: function() {
                if (this.bgmTimerID) clearTimeout(this.bgmTimerID);
                this.bgmIsPlaying = true;
                this.bgmCurrentNote = 0;
                this.bgmNextNoteTime = this.ctx.currentTime + 0.1;
                this.scheduleBGM();
            },
            
            stopBGM: function() {
                this.bgmIsPlaying = false;
                if (this.bgmTimerID) clearTimeout(this.bgmTimerID);
            },
            
            scheduleBGM: function() {
                if (!this.bgmIsPlaying || !this.ctx) return;
                
                if (level === 1) this.bgmTempo = 130;
                else if (level === 2) this.bgmTempo = 160;
                else if (level === 3) this.bgmTempo = 200;

                // 提前預排接下來 0.2 秒的音樂，防止卡頓或破音
                while (this.bgmNextNoteTime < this.ctx.currentTime + 0.2) {
                    this.playBGMNote(this.bgmNextNoteTime);
                    const secondsPerBeat = 60.0 / this.bgmTempo;
                    this.bgmNextNoteTime += 0.25 * secondsPerBeat;
                    this.bgmCurrentNote = (this.bgmCurrentNote + 1) % this.bgmSequence.length;
                }
                this.bgmTimerID = setTimeout(() => this.scheduleBGM(), 50);
            },
            
            playBGMNote: function(time) {
                let freq = this.bgmSequence[this.bgmCurrentNote];
                if (freq === 0) return; 
                if (level === 3) freq *= 2; 
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                
                osc.type = 'square';
                osc.frequency.value = freq;
                
                // 調高配樂音量到 0.08，確保聽得見
                gain.gain.setValueAtTime(0.08, time); 
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                
                osc.start(time); osc.stop(time + 0.1);
            },

            play: function(type) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                switch(type) {
                    case 'shoot': 
                        osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15); break;
                    case 'correct': 
                        osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1318.5, now + 0.1);
                        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3); break;
                    case 'wrong': 
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3); break;
                    case 'miss': 
                        osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2); break;
                    case 'levelup': 
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15);
                        osc.frequency.setValueAtTime(783.99, now + 0.3); osc.frequency.setValueAtTime(1046.50, now + 0.45);
                        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
                        osc.start(now); osc.stop(now + 0.8); break;
                    case 'gameover': 
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 1.5);
                        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 1.5);
                        osc.start(now); osc.stop(now + 1.5); break;
                }
            }
        };

        // --- 遊戲邏輯 ---
        function initAndStart() {
            // 這個獨立函式確保點擊按鈕時，一定會先解鎖音效引擎
            SoundEngine.init();
            startGame();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        document.getElementById('player-name').addEventListener('keypress', e => { if (e.key === 'Enter') saveScore(); });

        let camera = { z: 0 };
        const FOV = 400; 
        const emojis = ['🐻', '🐰', '🐯', '🐼', '🐷', '🐸', '🦊', '🐵', '🐔', '🦄'];
        
        let targets = [], splats = [], score = 0, level = 1, isPlaying = false, lastSpawnZ = 0, gunRecoil = 0; 
        const MAX_TIME = 60; let timeLeft = MAX_TIME, lastFrameTime = 0;
        let gameStats = { hitPrimes: [], wrongComposites: [], missedPrimes: [] };
        
        const levelsConfig = {
            1: { name: "(新手隧道)", speed: 10, spawnDist: 600, color: '#00FF00', bg: '#001100' },
            2: { name: "(加速空間)", speed: 18, spawnDist: 500, color: '#00D4FF', bg: '#000022' },
            3: { name: "(極速矩陣)", speed: 28, spawnDist: 400, color: '#FF0055', bg: '#220000' }
        };

        function isPrime(num) {
            if (num <= 1) return false;
            for (let i = 2; i <= Math.sqrt(num); i++) if (num % i === 0) return false;
            return true;
        }

        function getFactorMessage(num) {
            if (num <= 1) return "1 既不是質數也不是合數！";
            for (let i = 2; i <= Math.sqrt(num); i++) if (num % i === 0) return `${num} = ${i} × ${num/i}，是合數！`;
            return "";
        }

        function project(x, y, z) {
            let relativeZ = z - camera.z;
            if (relativeZ <= 0) return null; 
            let scale = FOV / relativeZ;
            return { x: (canvas.width / 2) + (x * scale), y: (canvas.height / 2) + (y * scale), scale: scale };
        }

        class Target {
            constructor(z) {
                this.number = Math.floor(Math.random() * 100) + 1;
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.x = (Math.random() - 0.5) * 1600; this.y = (Math.random() - 0.5) * 1000; this.z = z;
                this.isPrime = isPrime(this.number);
            }
        }

        class Splat {
            constructor(x, y, isSuccess) {
                this.x = x; this.y = y; this.color = isSuccess ? '#00FF00' : '#FF0000'; this.life = 1.0;
                this.particles = Array.from({length:8}, () => ({ dx: (Math.random()-0.5)*50, dy: (Math.random()-0.5)*50, r: Math.random()*15 + 5 }));
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
                this.particles.forEach(p => { ctx.beginPath(); ctx.arc(this.x + p.dx, this.y + p.dy, p.r, 0, Math.PI*2); ctx.fill(); });
                ctx.restore(); this.life -= 0.02;
            }
        }

        window.addEventListener('mousedown', () => {
            if (!isPlaying) return;
            gunRecoil = 25; 
            SoundEngine.play('shoot'); 
            
            let hitTarget = null, hitIndex = -1;
            targets.sort((a, b) => a.z - b.z);
            
            for (let i = 0; i < targets.length; i++) {
                let proj = project(targets[i].x, targets[i].y, targets[i].z);
                if (!proj) continue;
                if (Math.hypot(mouseX - proj.x, mouseY - proj.y) < 60 * proj.scale) { hitTarget = targets[i]; hitIndex = i; break; }
            }

            if (hitTarget) {
                splats.push(new Splat(mouseX, mouseY, hitTarget.isPrime));
                targets.splice(hitIndex, 1);
                if (hitTarget.isPrime) {
                    score += 10; timeLeft = Math.min(MAX_TIME, timeLeft + 3);
                    gameStats.hitPrimes.push(hitTarget.number);
                    SoundEngine.play('correct'); 
                    showMessage("命中質數！ +10 分 | ⚡ +3秒", "#00FF00");
                } else {
                    score -= 5; timeLeft -= 4;
                    gameStats.wrongComposites.push(hitTarget.number);
                    SoundEngine.play('wrong'); 
                    showMessage(getFactorMessage(hitTarget.number) + " | 扣 5 分 | ⚡ -4秒", "#FF4500");
                    triggerFlash();
                }
                updateUI(); checkLevelUp();
            } else {
                splats.push(new Splat(mouseX, mouseY, false));
            }
        });

        function showMessage(text, color) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text; msgEl.style.color = color;
            msgEl.style.textShadow = `0 0 10px ${color}, 2px 2px 5px #000`;
            msgEl.style.opacity = 1; setTimeout(() => msgEl.style.opacity = 0, 1500);
        }

        function triggerFlash() {
            const flash = document.getElementById('flash-overlay');
            flash.classList.remove('damage-flash'); void flash.offsetWidth;
            flash.classList.add('damage-flash');
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('level-desc').textContent = levelsConfig[level].name;
            document.getElementById('level-desc').style.color = levelsConfig[level].color;
        }

        function updateTimeBar() {
            const bar = document.getElementById('time-bar');
            const pct = Math.max(0, (timeLeft / MAX_TIME)) * 100;
            bar.style.width = pct + '%';
            if (pct > 50) bar.style.backgroundColor = '#00FF00';
            else if (pct > 25) bar.style.backgroundColor = '#FFD700';
            else bar.style.backgroundColor = '#FF0000';
        }

        function checkLevelUp() {
            let newLevel = score >= 250 ? 3 : (score >= 100 ? 2 : 1);
            if (newLevel > level) {
                level = newLevel;
                SoundEngine.play('levelup'); 
                const levelUpEl = document.getElementById('level-up');
                levelUpEl.textContent = `警告：空間加速！進入第 ${level} 關！`;
                levelUpEl.style.opacity = 1; setTimeout(() => levelUpEl.style.opacity = 0, 2000);
                updateUI();
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            document.body.classList.add('playing'); 
            
            score = 0; level = 1; camera.z = 0; lastSpawnZ = 0;
            targets = []; splats = []; timeLeft = MAX_TIME;
            gameStats = { hitPrimes: [], wrongComposites: [], missedPrimes: [] };
            
            updateUI(); updateTimeBar();
            isPlaying = true; lastFrameTime = performance.now();
            
            // 強制重啟音軌並播音樂
            if (SoundEngine.ctx && SoundEngine.ctx.state === 'suspended') SoundEngine.ctx.resume();
            SoundEngine.startBGM(); 
            
            requestAnimationFrame(gameLoop);
        }

        function formatStatsArray(arr) {
            if (arr.length === 0) return "無";
            let uniqueSorted = [...new Set(arr)].sort((a, b) => a - b);
            return uniqueSorted.join(", ") + ` (共 ${arr.length} 次)`;
        }

        function gameOver() {
            isPlaying = false;
            document.body.classList.remove('playing'); 
            
            SoundEngine.stopBGM(); 
            SoundEngine.play('gameover'); 
            
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-hit').textContent = formatStatsArray(gameStats.hitPrimes);
            document.getElementById('stat-wrong').textContent = formatStatsArray(gameStats.wrongComposites);
            document.getElementById('stat-missed').textContent = formatStatsArray(gameStats.missedPrimes);
            
            document.getElementById('player-name').value = '';
            document.getElementById('name-input-section').style.display = 'flex';
            document.getElementById('leaderboard-section').style.display = 'none';
            document.getElementById('player-name').focus();
        }

        // ======= 雲端線上排行榜邏輯 (Google Sheets) =======
        
        // ⚠️ 務必將下面這串換成您在 Step 3 複製下來的網址 ⚠️
        const API_URL = "https://script.google.com/macros/s/AKfycbxgRvvh9hLRKIuFR4KryZTUMJ3z3x8z4u83rIIz4WZPqHwjVKx99KDf0nXxyEvRoAPh/exec";

        async function saveScore() {
            const nameInput = document.getElementById('player-name').value.trim();
            const name = nameInput || "神秘挑戰者";
            
            // 按鈕顯示上傳中，並防止重複點擊
            const btn = document.querySelector('#name-input-section button');
            const originalText = btn.textContent;
            btn.textContent = "資料上傳中... ⏳";
            btn.disabled = true;

            try {
                // 將成績打包傳送給 Google 試算表
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ name: name, score: score }),
                    // 設定 Content-Type 為 text/plain 是為了避開瀏覽器惱人的 CORS 安全阻擋
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
            } catch(e) {
                console.error("上傳失敗", e);
            }
            
            btn.textContent = originalText;
            btn.disabled = false;
            showLeaderboard();
        }

        async function showLeaderboard() {
            document.getElementById('name-input-section').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'block';
            
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '<li style="justify-content:center;">連線讀取排行榜中... 📡</li>';
            
            try {
                // 從 Google 試算表讀取前五名
                const response = await fetch(API_URL);
                const leaderboard = await response.json();
                
                list.innerHTML = '';
                if(leaderboard.length === 0) {
                    list.innerHTML = '<li style="justify-content:center;">目前還沒有人上榜喔！</li>';
                    return;
                }

                leaderboard.forEach((entry, index) => {
                    const li = document.createElement('li');
                    li.style.display = 'flex'; li.style.justifyContent = 'space-between'; li.style.padding = '8px 0'; li.style.borderBottom = '2px dashed rgba(255,255,255,0.2)';
                    let medal = "🔹"; if (index === 0) medal = "🥇"; else if (index === 1) medal = "🥈"; else if (index === 2) medal = "🥉";
                    li.innerHTML = `<span>${medal} ${entry.name}</span> <span style="color:#00FF00;">${entry.score} 分</span>`;
                    list.appendChild(li);
                });
            } catch(e) {
                console.error("讀取失敗", e);
                list.innerHTML = '<li style="justify-content:center; color:#FF4500;">無法連線到伺服器 ❌</li>';
            }
        }
        // ==============================================

        function drawTunnel() {
            let config = levelsConfig[level];
            ctx.strokeStyle = config.color; ctx.lineWidth = 1.5;
            let startZ = Math.floor(camera.z / 200) * 200;
            for (let z = startZ; z < camera.z + 3000; z += 200) {
                let tl = project(-1200, -800, z), tr = project(1200, -800, z);
                let bl = project(-1200, 800, z), br = project(1200, 800, z);
                if (tl && tr && bl && br) {
                    ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y); ctx.closePath(); ctx.stroke();
                }
            }
            let corners = [[-1200, -800], [1200, -800], [-1200, 800], [1200, 800], [-1200, 0], [1200, 0], [0, -800], [0, 800]];
            for (let c of corners) {
                let pNear = project(c[0], c[1], camera.z + 10), pFar = project(c[0], c[1], camera.z + 3000);
                if (pNear && pFar) { ctx.beginPath(); ctx.moveTo(pNear.x, pNear.y); ctx.lineTo(pFar.x, pFar.y); ctx.stroke(); }
            }
        }

        function drawWeapon() {
            ctx.save();
            let targetX = canvas.width - 250, targetY = canvas.height + 50;
            ctx.translate(targetX + (mouseX - canvas.width / 2) * 0.05, targetY + (mouseY - canvas.height / 2) * 0.05);
            if (gunRecoil > 0) { ctx.translate(gunRecoil * 1.5, gunRecoil); ctx.rotate(gunRecoil * 0.005); gunRecoil -= 2; }
            ctx.rotate(-0.15);
            ctx.fillStyle = "#333"; ctx.beginPath(); ctx.ellipse(120, 20, 70, 35, Math.PI/6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#555"; ctx.beginPath(); ctx.ellipse(120, 10, 50, 15, Math.PI/6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.moveTo(30, -50); ctx.lineTo(50, 40); ctx.lineTo(0, 50); ctx.lineTo(-20, -50); ctx.fill();
            ctx.strokeStyle = "#222"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(-25, -20, 20, Math.PI/2, Math.PI*1.5); ctx.stroke();
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.moveTo(-10, -80); ctx.lineTo(-350, -120); ctx.lineTo(-350, -95); ctx.lineTo(-10, -40); ctx.fill();
            ctx.fillStyle = "#333"; for(let i=0; i<6; i++) { ctx.beginPath(); ctx.ellipse(-100 - i*40, -75 - i*4, 8, 15, -Math.PI/12, 0, Math.PI*2); ctx.fill(); }
            ctx.fillStyle = levelsConfig[level].color; ctx.beginPath(); ctx.moveTo(40, -90); ctx.lineTo(80, -20); ctx.lineTo(-20, -10); ctx.lineTo(-40, -80); ctx.fill();
            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(-20, -70, 50, 10); ctx.fillRect(-10, -50, 40, 10);
            ctx.fillStyle = "#111"; ctx.beginPath(); ctx.ellipse(20, -160, 60, 45, -Math.PI/8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#333"; ctx.beginPath(); ctx.ellipse(10, -175, 40, 20, -Math.PI/8, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#222"; ctx.fillRect(-5, -125, 30, 40);
            ctx.restore();
        }

        function drawCrosshair() {
            ctx.strokeStyle = "rgba(0, 255, 0, 0.8)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(mouseX, mouseY, 15, 0, Math.PI*2);
            ctx.moveTo(mouseX - 25, mouseY); ctx.lineTo(mouseX - 5, mouseY); ctx.moveTo(mouseX + 25, mouseY); ctx.lineTo(mouseX + 5, mouseY);
            ctx.moveTo(mouseX, mouseY - 25); ctx.lineTo(mouseX, mouseY - 5); ctx.moveTo(mouseX, mouseY + 25); ctx.lineTo(mouseX, mouseY + 5); ctx.stroke();
            ctx.fillStyle = "#FF0000"; ctx.beginPath(); ctx.arc(mouseX, mouseY, 3, 0, Math.PI*2); ctx.fill();
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            let dt = timestamp - lastFrameTime; lastFrameTime = timestamp; if (dt > 100) dt = 16;
            
            timeLeft -= dt / 1000;
            if (timeLeft <= 0) { timeLeft = 0; updateTimeBar(); gameOver(); return; }
            updateTimeBar();

            let config = levelsConfig[level];
            camera.z += config.speed;
            ctx.fillStyle = config.bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawTunnel();

            if (camera.z - lastSpawnZ > config.spawnDist) { targets.push(new Target(camera.z + 3000)); lastSpawnZ = camera.z; }
            targets.sort((a, b) => b.z - a.z);

            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                if (t.z < camera.z) {
                    if (t.isPrime) { 
                        score -= 2; timeLeft -= 2; gameStats.missedPrimes.push(t.number);
                        SoundEngine.play('miss'); showMessage("漏掉質數了！扣 2 分 | ⚡ -2秒", "#FFD700"); triggerFlash(); updateUI(); 
                    }
                    targets.splice(i, 1); continue;
                }
                let proj = project(t.x, t.y, t.z);
                if (!proj) continue;
                
                ctx.save(); ctx.translate(proj.x, proj.y); ctx.scale(proj.scale, proj.scale);
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.font = "80px Arial"; ctx.fillText(t.emoji, 0, -20);
                ctx.fillStyle = "rgba(255,255,255,0.9)"; ctx.beginPath(); ctx.arc(0, 40, 35, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 4; ctx.strokeStyle = config.color; ctx.stroke();
                ctx.fillStyle = "#000"; ctx.font = "bold 38px Arial"; ctx.fillText(t.number, 0, 42);
                ctx.restore();
            }

            for (let i = splats.length - 1; i >= 0; i--) { splats[i].draw(); if (splats[i].life <= 0) splats.splice(i, 1); }
            drawWeapon(); drawCrosshair();
            requestAnimationFrame(gameLoop);
        }
    </script>
